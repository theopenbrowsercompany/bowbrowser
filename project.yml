# XcodeGen spec. Bow.xcodeproj is generated from this file: edit here, then run `make project`.
name: Bow
options:
  bundleIdPrefix: dev.bowbrowser
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  BowCore:
    path: BowCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    # Apple Silicon only, and the CEF wrapper library is built for arm64 only.
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    # The packaging script reads the CEF download in Vendor/.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Xcode's compilation cache, shared by every worktree (compiles with the same inputs are reused, so a fresh
    # worktree's first build is faster). It lives beside the CEF copy that `make bootstrap` keeps.
    COMPILATION_CACHE_ENABLE_CACHING: YES
    COMPILATION_CACHE_CAS_PATH: $(HOME)/Library/Caches/bowbrowser/compile-cache
    # System header path, so warnings inside CEF's headers stay out of our build output.
    SYSTEM_HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/cef
    # The CEF wrapper library is a release build; match its assertions setting.
    GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "NDEBUG=1"]
    OTHER_LDFLAGS: ["$(SRCROOT)/Vendor/cef/build/libcef_dll_wrapper/libcef_dll_wrapper.a"]

targets:
  Bow Helper:
    type: application
    platform: macOS
    sources: [App/Helper]
    info:
      path: Generated/Helper-Info.plist
      properties:
        LSUIElement: true
        LSFileQuarantineEnabled: true
        NSSupportsAutomaticGraphicsSwitching: true
    settings:
      PRODUCT_NAME: Bow Helper
      PRODUCT_BUNDLE_IDENTIFIER: dev.bowbrowser.Bow.helper

  Bow:
    type: application
    platform: macOS
    sources:
      - App/Engine
      - App/UI
      - path: E2E
        excludes: [Fixtures]
      # Fixture pages for `make e2e`, copied as one folder into the app's Resources.
      - path: E2E/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Bow Helper
        embed: false
      - package: BowCore
    info:
      path: Generated/Bow-Info.plist
      properties:
        CFBundleDisplayName: Bow
        NSSupportsAutomaticGraphicsSwitching: true
        # macOS asks these the first time a site Bow has allowed uses the camera, microphone or location.
        NSCameraUsageDescription: Websites you allow can use your camera, for example for video calls.
        NSMicrophoneUsageDescription: Websites you allow can use your microphone, for example for calls.
        NSLocationUsageDescription: Websites you allow can use your location, for example for maps.
        NSLocationWhenInUseUsageDescription: Websites you allow can use your location, for example for maps.
        # Bow can open web links from other apps (GetURL Apple Events). Declaring the schemes lets the person choose
        # Bow as their browser; Bow never makes itself the default.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
    settings:
      base:
        PRODUCT_NAME: Bow
        PRODUCT_BUNDLE_IDENTIFIER: dev.bowbrowser.Bow
        SWIFT_OBJC_BRIDGING_HEADER: App/Engine/Bow-Bridging-Header.h
      configs:
        # Debug builds carry the e2e harness: BOW_E2E compiles the seams marked "E2E seam" that hand
        # `--e2e` runs to E2E/. Release builds leave out the harness, its fixtures and the seams.
        Debug:
          GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "BOW_E2E=1"]
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ["$(inherited)", "BOW_E2E"]
        Release:
          # Everything under E2E/, at any depth up to four folders (a pattern's * does not cross folders).
          EXCLUDED_SOURCE_FILE_NAMES:
            - "$(SRCROOT)/E2E/*"
            - "$(SRCROOT)/E2E/*/*"
            - "$(SRCROOT)/E2E/*/*/*"
            - "$(SRCROOT)/E2E/*/*/*/*"
            - "Fixtures"
    postBuildScripts:
      - name: Package CEF
        script: '"$SRCROOT/scripts/package-cef.sh"'
        basedOnDependencyAnalysis: false

schemes:
  Bow:
    build:
      targets:
        Bow: all
    run:
      config: Debug
