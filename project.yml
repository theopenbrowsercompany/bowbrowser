# XcodeGen spec. Bow.xcodeproj is generated from this file: edit here, then run `make project`.
name: Bow
options:
  bundleIdPrefix: dev.bowbrowser
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  BowCore:
    path: BowCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    # The packaging script reads the CEF download in Vendor/.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # System header path, so warnings inside CEF's headers stay out of our build output.
    SYSTEM_HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/cef
    # The CEF wrapper library is a release build; match its assertions setting.
    GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "NDEBUG=1"]
    OTHER_LDFLAGS: ["$(SRCROOT)/Vendor/cef/build/libcef_dll_wrapper/libcef_dll_wrapper.a"]

targets:
  Bow Helper:
    type: application
    platform: macOS
    sources: [App/Helper]
    info:
      path: Generated/Helper-Info.plist
      properties:
        LSUIElement: true
        LSFileQuarantineEnabled: true
        NSSupportsAutomaticGraphicsSwitching: true
    settings:
      PRODUCT_NAME: Bow Helper
      PRODUCT_BUNDLE_IDENTIFIER: dev.bowbrowser.Bow.helper

  Bow:
    type: application
    platform: macOS
    sources:
      - App/Engine
      - App/UI
      - path: App/E2E
        excludes: [Fixtures]
      # Fixture pages for `make e2e`, copied as one folder into the app's Resources.
      - path: App/E2E/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Bow Helper
        embed: false
      - package: BowCore
    info:
      path: Generated/Bow-Info.plist
      properties:
        CFBundleDisplayName: Bow
        NSSupportsAutomaticGraphicsSwitching: true
    settings:
      base:
        PRODUCT_NAME: Bow
        PRODUCT_BUNDLE_IDENTIFIER: dev.bowbrowser.Bow
        SWIFT_OBJC_BRIDGING_HEADER: App/Engine/Bow-Bridging-Header.h
      configs:
        # Debug builds carry the e2e harness: BOW_E2E compiles the seams marked "E2E seam" that hand
        # `--e2e` runs to App/E2E. Release builds leave out the harness, its fixtures and the seams.
        Debug:
          GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "BOW_E2E=1"]
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ["$(inherited)", "BOW_E2E"]
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: ["$(SRCROOT)/App/E2E/Runner/*", "$(SRCROOT)/App/E2E/Engine/*", "Fixtures"]
    postBuildScripts:
      - name: Package CEF
        script: '"$SRCROOT/scripts/package-cef.sh"'
        basedOnDependencyAnalysis: false

schemes:
  Bow:
    build:
      targets:
        Bow: all
    run:
      config: Debug
