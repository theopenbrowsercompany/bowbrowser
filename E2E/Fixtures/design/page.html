<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page</title>
  <style>
    body { margin: 0; padding: 40px 48px; font: 16px/1.6 -apple-system, sans-serif; color: #222; }
    body.dark { background: #111; color: #eee; }
    h1 { margin: 0 0 12px; font-size: 32px; }
    p { max-width: 36em; }
  </style>
  <script>
    // ?title=<name> names the page; ?dark=1 gives it a dark background of its own.
    const params = new URLSearchParams(location.search);
    document.title = params.get("title") || "Page";
    addEventListener("DOMContentLoaded", () => {
      document.querySelector("h1").textContent = document.title;
      if (params.get("dark")) document.body.classList.add("dark");
    });
  </script>
</head>
<body>
  <h1>Page</h1>
  <p>A plain page for looking at the window around it: the frame, the sidebar and the page card.</p>
  <p>The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs.</p>
</body>
</html>
