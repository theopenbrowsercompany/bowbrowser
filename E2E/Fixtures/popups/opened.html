<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>B</title>
  <style>
    body { margin: 0; font: 16px -apple-system, sans-serif; background: #fff; color: #111; }
    h1 { margin: 0; padding: 24px; background: #1f9d55; color: #fff; }
  </style>
</head>
<body>
  <h1>B</h1>
  <script>
    // Tells the page that opened this one that it has loaded: through window.opener when it is kept, and on a
    // broadcast channel the opener listens to either way.
    window.addEventListener("load", () => {
      if (window.opener) window.opener.postMessage("opener" + location.search, "*");
      new BroadcastChannel("popups").postMessage("loaded" + location.search);
    });
  </script>
</body>
</html>
