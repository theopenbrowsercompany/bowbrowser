<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auth start</title>
  <style>
    body { margin: 0; font: 16px -apple-system, sans-serif; background: #fff; color: #111; }
    h1 { margin: 0; padding: 24px; background: #2f6fde; color: #fff; }
  </style>
</head>
<body>
  <h1>Auth start</h1>
  <p>The page a sign in or certificate error test starts from, and the page Go back returns to.</p>
  <button id="panel" onclick="window.bowPanel = window.open('panel.html', '', 'width=420,height=300')">Open a popup panel</button>
  <script>
    // What the popup panel posts back (panel.html).
    window.bowMessages = [];
    window.addEventListener("message", (event) => window.bowMessages.push(String(event.data)));
  </script>
</body>
</html>
