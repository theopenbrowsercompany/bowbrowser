<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unload capture</title>
  <script>
    // Starts the camera and keeps its track live, so the tab counts as capturing until it closes.
    function startCamera() {
      window.cameraResult = navigator.mediaDevices.getUserMedia({ video: true }).then(
        (stream) => { window.stream = stream; return "live"; },
        (error) => error.name);
      return "started";
    }
  </script>
</head>
<body>
  <h1>Unload capture fixture</h1>
  <p>A tab that keeps the camera on.</p>
</body>
</html>
