<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unload form</title>
  <link rel="icon" type="image/png" href="/sidebar/icon.png">
</head>
<body>
  <h1>Unload form fixture</h1>
  <p>A field with no beforeunload handler: typing into it must keep the tab loaded.</p>
  <input id="field" type="text" autocomplete="off">
  <script>
    // Key events that reached the page, so a test can show text arrived without any.
    window.keys = 0;
    addEventListener("keydown", () => { window.keys += 1; }, true);
  </script>
</body>
</html>
