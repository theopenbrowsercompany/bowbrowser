<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unload audible</title>
  <link rel="icon" type="image/png" href="/sidebar/icon.png">
</head>
<body>
  <h1>Unload audible fixture</h1>
  <p>Plays a 440 Hz tone at about -70 dBFS (RMS), too quiet to hear, through an audio element.
    Click the button first: the click is the user activation that lets the page start sound.</p>
  <button id="activate" type="button">Allow sound</button>
  <audio id="tone" loop></audio>
  <script>
    // A sine wave's RMS is its peak over the square root of 2: a peak of -67 dBFS is about -70 dBFS RMS.
    const peak = Math.pow(10, -67 / 20);

    // One second of the tone as a 16 bit mono WAV file, looped by the element.
    const toneURL = (() => {
      const rate = 8000;
      const samples = rate;
      const view = new DataView(new ArrayBuffer(44 + samples * 2));
      const text = (offset, value) => [...value].forEach((c, i) => view.setUint8(offset + i, c.charCodeAt(0)));
      text(0, "RIFF");
      view.setUint32(4, 36 + samples * 2, true);
      text(8, "WAVE");
      text(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, rate, true);
      view.setUint32(28, rate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      text(36, "data");
      view.setUint32(40, samples * 2, true);
      for (let i = 0; i < samples; i++) {
        view.setInt16(44 + i * 2, Math.round(Math.sin((2 * Math.PI * 440 * i) / rate) * peak * 32767), true);
      }
      return URL.createObjectURL(new Blob([view.buffer], { type: "audio/wav" }));
    })();

    window.activated = false;
    document.getElementById("activate").addEventListener("click", () => { window.activated = true; });

    const element = document.getElementById("tone");
    element.src = toneURL;
    // Resolves once the element plays, or with why it could not.
    window.startElement = () => element.play().then(() => "playing", (error) => `refused: ${error.name}`);
    window.stopElement = () => { element.pause(); return element.paused; };
  </script>
</body>
</html>
