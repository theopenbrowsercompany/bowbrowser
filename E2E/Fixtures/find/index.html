<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bow find fixture</title>
  <style>
    body { margin: 0; font: 18px -apple-system, sans-serif; background: #fff; color: #111; }
    h1 { margin: 0; padding: 24px; background: #2f6fde; color: #fff; }
    p { padding: 0 24px; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>Bow find fixture</h1>
  <!-- The e2e test searches for the word in the three spans: exactly three matches, in #m1, #m2 and #m3. -->
  <p>An <span id="m1">arrow</span> leaves the string.</p>
  <p>A second <span id="m2">arrow</span> follows the first.</p>
  <p>The third <span id="m3">arrow</span> hits the target.</p>
</body>
</html>
