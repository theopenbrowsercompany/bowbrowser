<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Move fixture</title>
  <script>
    // Changes with every new document, so a reload in place of the old page shows up.
    window.bowLoadID = String(Math.random()).slice(2) + "-" + Date.now();
  </script>
</head>
<body>
  <h1>Move fixture</h1>
  <p>A page whose typed text survives only while its page stays live.</p>
  <input id="field" placeholder="Type here">
</body>
</html>
