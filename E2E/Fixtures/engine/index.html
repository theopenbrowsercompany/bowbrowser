<!doctype html>
<meta charset="utf-8">
<title>engine hooks</title>
<script>
  // Every key the page sees, so a test can tell which ones the app claimed first.
  window.keyDowns = [];
  window.keyUps = [];
  addEventListener('keydown', (event) => keyDowns.push(event.key), true);
  addEventListener('keyup', (event) => keyUps.push(event.key), true);
</script>
<button id="open" onclick="window.open('opened.html')" style="width: 200px; height: 60px">Open a page</button>
