# Chromium's crash reporter (Crashpad) settings, read from Bow.app/Contents/Resources (CEF's cef_crash_util.h).
# Debug builds only: project.yml leaves this file out of Release builds, and scripts/check-release.sh fails a
# Release app that carries it.
# With the file present, Crashpad writes a minidump for every crashed process (browser, renderer, GPU, utility)
# into its database, which CEF puts in the root data folder itself (CefSettings.root_cache_path: pending/,
# completed/ and settings.dat beside Default; for an e2e run, build/e2e/<run>/profile).
# There is deliberately no ServerURL: reports stay on this machine and nothing is ever uploaded.

[Config]
ProductName=Bow
BrowserCrashForwardingEnabled=false
MaxDatabaseSizeInMb=20
MaxDatabaseAgeInDays=5
