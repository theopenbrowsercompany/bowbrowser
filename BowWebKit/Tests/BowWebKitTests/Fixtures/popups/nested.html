<!doctype html>
<meta charset="utf-8">
<title>Popup that opens a popup</title>
<style>
  button { display: block; width: 200px; height: 40px; margin: 10px; }
</style>
<body data-opened="">
<button id="open" onclick="record(window.open('child.html'))">Open a popup of its own</button>
<script>
  // What the last window.open returned, in the DOM so the tests' own script world reads it.
  function record(opened) {
    document.body.dataset.opened = opened === null ? "null" : "window";
  }
  // ?timer also opens a page from a timer the page starts as it loads, with no click; data-timer says what it got.
  if (location.search === "?timer") {
    window.addEventListener("load", () => setTimeout(() => {
      document.body.dataset.timer = window.open("child.html") === null ? "null" : "window";
    }, 0));
  }
</script>
</body>
