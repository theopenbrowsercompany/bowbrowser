<!doctype html>
<meta charset="utf-8">
<title>Popup opener</title>
<style>
  button, a { display: block; width: 200px; height: 40px; margin: 10px; }
</style>
<body data-opened="">
<button id="tab" onclick="record(window.open('child.html'))">Open a tab</button>
<button id="sized" onclick="record(window.open('child.html', 'signin', 'width=480,height=560'))">Open a sized popup</button>
<button id="closer" onclick="record(window.open('closer.html'))">Open a page that closes itself</button>
<a id="link" href="child.html" target="_blank" rel="opener">A link with a target</a>
<script>
  // What the last window.open returned, in the DOM so the tests' own script world reads it: "window", or "null" when
  // nothing opened.
  function record(opened) {
    document.body.dataset.opened = opened === null ? "null" : "window";
  }
  // ?auto opens a page as soon as the page loads, with no click, so with no user gesture.
  if (location.search === "?auto") {
    window.addEventListener("load", () => record(window.open("child.html")));
  }
</script>
</body>
