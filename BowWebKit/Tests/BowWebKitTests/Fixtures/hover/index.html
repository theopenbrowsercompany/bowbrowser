<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hover</title>
<style>
  body { margin: 0; font: 16px -apple-system, sans-serif; }
  #row { display: flex; gap: 160px; padding: 120px 80px; }
  a { display: block; width: 240px; height: 60px; line-height: 60px; text-align: center; background: #eef; }
</style>
</head>
<body>
<!-- Two links with a gap between them, and room around both for the pointer to rest off every link. -->
<div id="row">
  <a id="one" href="one.html">Link one</a>
  <a id="two" href="two.html"><span id="two-label">Link two</span></a>
</div>
<p id="gap">Not a link.</p>
</body>
</html>
