<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Icon link</title>
<!-- A touch icon is not the tab's icon: the first link whose rel lists "icon" is. -->
<link rel="apple-touch-icon" href="touch.png">
<link rel="shortcut icon" href="icon.png">
<link rel="icon" href="second.png">
</head>
<body>
<p>A page with an icon link.</p>
</body>
</html>
