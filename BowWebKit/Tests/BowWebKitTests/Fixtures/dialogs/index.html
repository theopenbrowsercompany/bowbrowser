<!doctype html>
<meta charset="utf-8">
<title>Dialogs</title>
<p>The page's own buttons ask; each writes what its dialog returned into #answer as JSON.</p>
<button id="alert" onclick="answer.textContent = JSON.stringify(alert('Saved') ?? 'returned')">Alert</button>
<button id="confirm" onclick="answer.textContent = JSON.stringify(confirm('Leave?'))">Confirm</button>
<button id="prompt" onclick="answer.textContent = JSON.stringify(prompt('Your name?', 'Ada'))">Prompt</button>
<button id="prompt-empty" onclick="answer.textContent = JSON.stringify(prompt('Nothing?'))">Prompt</button>
<pre id="answer"></pre>
