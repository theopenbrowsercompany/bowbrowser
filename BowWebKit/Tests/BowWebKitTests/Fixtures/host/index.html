<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Host</title>
<style>
  body { margin: 0; font: 16px -apple-system, sans-serif; }
  #target { position: absolute; left: 100px; top: 120px; width: 200px; height: 80px; }
</style>
</head>
<body>
<p id="text">The test host page.</p>
<button id="target">Click me</button>
<!-- Every click the button got, as JSON: true for a trusted one (a real input event, not a script one). It lives in
     the DOM because the tests read the page from their own script world, which shares the DOM, not globals. -->
<output id="clicks">[]</output>
<script>
  const clicks = [];
  document.getElementById("target").addEventListener("click", (event) => {
    clicks.push(event.isTrusted);
    document.getElementById("clicks").textContent = JSON.stringify(clicks);
  });
</script>
</body>
</html>
